services:
  inference:
    build: .
    container_name: flowx-inference-server
    ports:
      - "8100:8100"
    environment:
      MODELS_DIR: /models
      LORAS_DIR: /loras
      INPUT_DIR: /input               # image.load 算子读取服务端本地图片的目录
      VIDEO_DIR: /videos              # VIDEO 对象 mp4 落盘目录（GET /videos/{id} 下载）
      MAX_RESIDENT_MODELS: "2"        # 显存常驻模型上限，超出按 LRU 淘汰
      OFFLOAD_MODE: "none"            # 显存治理：none / model（子模块搬移）/ sequential（逐层搬移，视频模型用）
      INFERENCE_TOKEN: ""             # 非空则启用 Bearer 鉴权
    volumes:
      - ./models:/models              # 把 safetensors/ckpt 模型文件放到 ./models
      - ./loras:/loras                # LoRA 文件放到 ./loras
      - ./input:/input                # 图生图原图放 ./input（image.load 算子读取；客户端上传走 POST /images 无需此目录）
      - ./videos:/videos              # 视频结果 mp4 落盘目录
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
