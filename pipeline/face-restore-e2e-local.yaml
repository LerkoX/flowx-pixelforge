      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ FS1.image }}"
        filename_prefix: "face_fs1_photo_gfpgan_up1"
        output_dir: "~/flowx-e2e-out"


  SaveFP1:
    name: 落盘 fp1_photo_gfpgan_up1
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ FP1.image }}"
        filename_prefix: "face_fp1_photo_gfpgan_up1"
        output_dir: "~/flowx-e2e-out"


  SaveIn1:
    name: 落盘输入 face_sharp
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Param.face_sharp }}"
        filename_prefix: "face_in1_face_sharp"
        output_dir: "~/flowx-e2e-out"


  SaveIn2:
    name: 落盘输入 face_small
    config:
