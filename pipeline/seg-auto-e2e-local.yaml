Name: seg-auto-e2e-local
Description: B3/G2 SAM 自动分割 e2e（全 local）：加载图 → 装载 SAM → 自动分割（点阵+去重+keep 挑选）→ 落盘网格图/选中并集/彩色叠加
Param:
  service_url: "http://1bba08c4.r7.cpolar.cn"
  service_url_host: "http://1bba08c4.r7.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-input/b3_person.png"
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadImage
    Ensure --> SAMLoad
    LoadImage --> SAMAuto
    SAMLoad --> SAMAuto
    SAMAuto --> SaveMontage
    SAMAuto --> SaveSelected
    SAMAuto --> SaveOverlay
    SaveMontage --> [*]
    SaveSelected --> [*]
    SaveOverlay --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadImage:
    name: 加载原图
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.image_path }}"
  SAMLoad:
    name: 装载 SAM（vit_l）
    config:
      nodeRef: sam-load@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        variant: "vit_l"
        dtype: "fp32"
  SAMAuto:
    name: 自动全图分割（keep=0,2）
    config:
      nodeRef: sam-auto-segment@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        model: "{{ SAMLoad.model }}"
        points_per_side: 8
        pred_iou_thresh: 0.88
        stability_score_thresh: 0.95
        min_area: 400
        max_masks: 12
        keep: "0,2"
        sort: "area"
        overlay: 0.45
  SaveMontage:
    name: 落盘-编号网格图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMAuto.masks }}"
        filename_prefix: "seg_auto_montage"
        output_dir: "~/flowx-e2e-out"
  SaveSelected:
    name: 落盘-选中并集蒙版
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMAuto.selected }}"
        filename_prefix: "seg_auto_selected"
        output_dir: "~/flowx-e2e-out"
  SaveOverlay:
    name: 落盘-并集彩色叠加
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMAuto.selected_overlay }}"
        filename_prefix: "seg_auto_overlay"
        output_dir: "~/flowx-e2e-out"
