Name: ecom-model-swap
Description: >-
  G11 电商模板⑤：模特换装（FLUX 蒙版局部重绘 + Redux 参考衣注入）。输入＝模特图 + 服装参考图 +
  蒙版笔画（mask-paint 手绘或外部生成的 strokes JSON），输出＝模特穿着该服装的同尺寸成图，
  蒙版区外**逐像素不变**（无缝贴回）。与 CatVTON 路线（ecom 模板④）的分工：本路线走 FLUX
  img2img 局部重绘，细节保留更好（dev-log §59.2 实测清晰度保留 84% vs 49%），但单节点耗时
  与画布面积强相关（§59.3：guide_size 768 时约 2.8h，512 约 X）。默认 docker 执行器。
Param:
  service_url: http://172.17.0.1:8100
  service_url_host: http://1bba08c4.r7.cpolar.cn
  service_token: 30e494999da13134808ee280aea6dffd
  model_path: ~/flowx-output/flux-hanfu-beauty_20260929_103417.png
  garment_path: ~/flowx-output/pink_dress_20260921_105810.png
  strokes_ref: ~/flowx-input/uploads/strokes/flux-virtual-tryon-maskpaint.strokes.json
  prompt: a professional fashion photo, model wearing an elegant pink dress, studio lighting
  seed: '20260925'
  guide_size: '512'
  output_dir: ~/flowx-output
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> UnetLoad
    Ensure --> ClipLoad
    Ensure --> VaeLoad
    Ensure --> MaskPaint
    Ensure --> GarmentLoad
    MaskPaint --> MaskGrow
    MaskPaint --> MaskRefine
    MaskGrow --> MaskFeather
    MaskFeather --> MaskRefine
    ClipLoad --> Encode
    Encode --> ReduxApply
    GarmentLoad --> ReduxApply
    UnetLoad --> MaskRefine
    VaeLoad --> MaskRefine
    ReduxApply --> MaskRefine
    MaskRefine --> Save
    Save --> Unload
    Unload --> [*]
Nodes:
  Ensure:
    name: 推理服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: '{{ Param.service_url }}'
        service_token: '{{ Param.service_token }}'
        wait_seconds: '60'
  UnetLoad:
    name: UNET 加载
    config:
      nodeRef: flux-unet-load@1.3.0
      executor: docker
      params:
        service_url: '{{ Param.service_url }}'
        service_url_host: '{{ Param.service_url_host }}'
        service_token: '{{ Param.service_token }}'
  ClipLoad:
    name: DualCLIP 加载
    config:
      nodeRef: flux-dual-clip-load@1.3.0
      executor: docker
      params:
        service_url: '{{ Param.service_url }}'
        service_url_host: '{{ Param.service_url_host }}'
        service_token: '{{ Param.service_token }}'
  VaeLoad:
    name: VAE 加载
    config:
      nodeRef: flux-vae-load@1.3.0
      executor: docker
      params:
        service_url: '{{ Param.service_url }}'
        service_url_host: '{{ Param.service_url_host }}'
        service_token: '{{ Param.service_token }}'
  MaskPaint:
    name: 手绘蒙版（模特图 + 笔画）
    config:
      nodeRef: mask-paint@1.4.0
      executor: local
      params:
        service_url: '{{ Param.service_url }}'
        service_token: '{{ Param.service_token }}'
        image_path: '{{ Param.model_path }}'
        strokes_ref: '{{ Param.strokes_ref }}'
  MaskGrow:
    name: 蒙版外扩
    config:
      nodeRef: mask-grow@1.1.0
      executor: local
      params:
        service_url: '{{ Param.service_url }}'
        mask: '{{ MaskPaint.mask }}'
        radius: '12'
  MaskFeather:
    name: 蒙版羽化
    config:
      nodeRef: mask-feather@1.1.0
      executor: local
      params:
        service_url: '{{ Param.service_url }}'
        mask: '{{ MaskGrow.mask }}'
        radius: '8'
  GarmentLoad:
    name: 服装参考图
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: '{{ Param.service_url }}'
        service_url_host: '{{ Param.service_url_host }}'
        service_token: '{{ Param.service_token }}'
        image_path: '{{ Param.garment_path }}'
  Encode:
    name: 提示词编码
    config:
      nodeRef: flux-clip-encode@2.0.0
      executor: docker
      params:
        service_url: '{{ Param.service_url }}'
        service_url_host: '{{ Param.service_url_host }}'
        service_token: '{{ Param.service_token }}'
        clip: '{{ ClipLoad.clip }}'
        text: '{{ Param.prompt }}'
  ReduxApply:
    name: Redux 注入参考衣
    config:
      nodeRef: flux-redux-apply@1.2.0
      executor: docker
      params:
        service_url: '{{ Param.service_url }}'
        service_url_host: '{{ Param.service_url_host }}'
        service_token: '{{ Param.service_token }}'
        cond: '{{ Encode.cond }}'
        image: '{{ GarmentLoad.image }}'
        strength: '0.9'
  MaskRefine:
    name: 蒙版局部重绘
    config:
      nodeRef: flux-mask-refine@1.0.0
      executor: docker
      params:
        service_url: '{{ Param.service_url }}'
        service_url_host: '{{ Param.service_url_host }}'
        service_token: '{{ Param.service_token }}'
        model: '{{ UnetLoad.model }}'
        vae: '{{ VaeLoad.vae }}'
        cond: '{{ ReduxApply.cond }}'
        image: '{{ MaskPaint.image }}'
        mask: '{{ MaskFeather.mask }}'
        denoise: '0.8'
        steps: '8'
        guide_size: '{{ Param.guide_size }}'
        padding: '0.3'
        feather: '16'
        seed: '{{ Param.seed }}'
  Save:
    name: 保存成图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: '{{ Param.service_url }}'
        service_token: '{{ Param.service_token }}'
        image: '{{ MaskRefine.image }}'
        filename_prefix: model_swap
        output_dir: '{{ Param.output_dir }}'
  Unload:
    name: 卸载模型
    config:
      nodeRef: model-unload@1.1.0
      executor: local
      params:
        service_url: '{{ Param.service_url }}'
        service_token: '{{ Param.service_token }}'
