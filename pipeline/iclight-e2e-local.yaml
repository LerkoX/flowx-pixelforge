Name: iclight-e2e-local
Description: B4/S3 G9 IC-Light 重打光 e2e（全 local）：抠图(BiRefNet)→按 mask 合成 127 灰底→fc 变体左/右光重打光（+复跑确定性 +highres）→落盘
Param:
  service_url: "http://1bba08c4.r7.cpolar.cn"
  service_url_host: "http://1bba08c4.r7.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-input/b3_person.png"
Graph: |
  stateDiagram-v2
  [*] --> Ensure
  Ensure --> CL
  Ensure --> L
  L --> Matte
  CL --> Left
  L --> Left
  Matte --> Left
  CL --> Right
  L --> Right
  Matte --> Right
  CL --> Rep
  L --> Rep
  Matte --> Rep
  CL --> Hi
  L --> Hi
  Matte --> Hi
  Left --> Matte2
  Matte2 --> SMatte2
  Left --> SLeft
  Right --> SRight
  Rep --> SRep
  Hi --> SHi
  Matte --> SMask
  L --> SInput
  SLeft --> [*]
  SRight --> [*]
  SRep --> [*]
  SHi --> [*]
  SMask --> [*]
  SMatte2 --> [*]
  SInput --> [*]
Nodes:
  Ensure:
    name: Ensure
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  CL:
    name: CL
    config:
      nodeRef: iclight-load@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        variant: "fc"
        dtype: "fp32"
        weights: ""
        reload: "false"
  L:
    name: L
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.image_path }}"
  Matte:
    name: Matte
    config:
      nodeRef: matting-birefnet@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ L.image }}"
        variant: "main"
        resolution: 1024
        refine: "true"
        refine_radius: 90
        alpha_gamma: 1
        invert: "false"
  Left:
    name: Left
    config:
      nodeRef: iclight@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        light_dir: "left"
        model: "{{ CL.model }}"
        image: "{{ L.image }}"
        mask: "{{ Matte.mask }}"
        prompt: "beautiful woman, detailed face, sunshine from window"
        steps: 25
        cfg: 2.0
        seed: 12345
        highres: "false"
        highres_scale: 1.5
        scheduler: "dpmpp"
  Right:
    name: Right
    config:
      nodeRef: iclight@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        light_dir: "right"
        model: "{{ CL.model }}"
        image: "{{ L.image }}"
        mask: "{{ Matte.mask }}"
        prompt: "beautiful woman, detailed face, sunshine from window"
        steps: 25
        cfg: 2.0
        seed: 12345
        highres: "false"
        highres_scale: 1.5
        scheduler: "dpmpp"
  Rep:
    name: Rep
    config:
      nodeRef: iclight@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        light_dir: "left"
        model: "{{ CL.model }}"
        image: "{{ L.image }}"
        mask: "{{ Matte.mask }}"
        prompt: "beautiful woman, detailed face, sunshine from window"
        steps: 25
        cfg: 2.0
        seed: 12345
        highres: "false"
        highres_scale: 1.5
        scheduler: "dpmpp"
  Hi:
    name: Hi
    config:
      nodeRef: iclight@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        light_dir: "left"
        model: "{{ CL.model }}"
        image: "{{ L.image }}"
        mask: "{{ Matte.mask }}"
        prompt: "beautiful woman, detailed face, sunshine from window"
        steps: 25
        cfg: 2.0
        seed: 12345
        highres: "true"
        highres_scale: 1.5
        scheduler: "dpmpp"
  Matte2:
    name: Matte2
    config:
      nodeRef: matting-birefnet@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Left.image }}"
        variant: "main"
        resolution: 1024
        refine: "true"
        refine_radius: 90
        alpha_gamma: 1
        invert: "false"
  SMatte2:
    name: SMatte2
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Matte2.mask }}"
        filename_prefix: "icl_left_matte"
        output_dir: "~/flowx-e2e-out"
  SLeft:
    name: SLeft
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Left.image }}"
        filename_prefix: "icl_left"
        output_dir: "~/flowx-e2e-out"
  SRight:
    name: SRight
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Right.image }}"
        filename_prefix: "icl_right"
        output_dir: "~/flowx-e2e-out"
  SRep:
    name: SRep
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Rep.image }}"
        filename_prefix: "icl_rep"
        output_dir: "~/flowx-e2e-out"
  SHi:
    name: SHi
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Hi.image }}"
        filename_prefix: "icl_hi"
        output_dir: "~/flowx-e2e-out"
  SMask:
    name: SMask
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Matte.mask }}"
        filename_prefix: "icl_mask"
        output_dir: "~/flowx-e2e-out"
  SInput:
    name: SInput
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ L.image }}"
        filename_prefix: "icl_input"
