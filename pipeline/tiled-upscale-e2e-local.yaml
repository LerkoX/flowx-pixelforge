Name: tiled-upscale-e2e-local
Description: B3/G4 分块重绘超分 e2e（全 local 执行器）：加载图 → 切片规划（网格+预估）→ Checkpoint/CLIP 条件 → 逐块 img2img 重绘 + 权重归一化无缝融合 → 落盘超分图/预放大图/接缝权重图
Param:
  service_url: "http://749a0d06.r7.cpolar.cn"
  service_url_host: "http://749a0d06.r7.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-input/b3_person.png"
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadImage
    Ensure --> Plan
    Ensure --> CKPT
    LoadImage --> Plan
    CKPT --> Pos
    CKPT --> Neg
    LoadImage --> Apply
    Plan --> Apply
    CKPT --> Apply
    Pos --> Apply
    Neg --> Apply
    Apply --> SaveUp
    Apply --> SavePre
    Apply --> SaveSeam
    LoadImage --> SaveInput
    SaveUp --> [*]
    SavePre --> [*]
    SaveSeam --> [*]
    SaveInput --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadImage:
    name: 加载原图
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.image_path }}"
  Plan:
    name: 切片规划（2x / 512 / overlap 64）
    config:
      nodeRef: tiled-upscale-plan@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        scale: 2.0
        target_w: 0
        target_h: 0
        tile: 512
        overlap: 64
        pre: "lanczos"
        denoise: 0.35
        seed: 12345
        seam_fix: "mask"
        band_denoise: 0.25
        steps: 8
  CKPT:
    name: Checkpoint 加载
    config:
      nodeRef: checkpoint-loader@1.4.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "v1-5-pruned-emaonly"
  Pos:
    name: 正向提示词
    config:
      nodeRef: clip-text-encode@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ CKPT.clip_ref }}"
        text: "a photo of a person, sharp focus, highly detailed skin and fabric texture"
  Neg:
    name: 反向提示词
    config:
      nodeRef: clip-text-encode@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ CKPT.clip_ref }}"
        text: "lowres, blurry, worst quality, watermark, text, jpeg artifacts"
  Apply:
    name: 分块重绘（4 块 × 8 步）
    config:
      nodeRef: tiled-upscale-apply@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        model: "{{ CKPT.model_ref }}"
        pos: "{{ Pos.conditioning }}"
        neg: "{{ Neg.conditioning }}"
        plan: "{{ Plan.plan }}"
        tile: 512
        overlap: 64
        scale: 2.0
        target_w: 0
        target_h: 0
        pre: "lanczos"
        denoise: 0.35
        seed: 12345
        seam_fix: "mask"
        band_denoise: 0.25
        steps: 8
        cfg: 7.0
        sampler_name: ""
        scheduler: "normal"
  SaveUp:
    name: 落盘-超分结果
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Apply.image }}"
        filename_prefix: "tiled_up"
        output_dir: "~/flowx-e2e-out"
  SavePre:
    name: 落盘-预放大图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Apply.pre_upscaled }}"
        filename_prefix: "tiled_pre"
        output_dir: "~/flowx-e2e-out"
  SaveSeam:
    name: 落盘-接缝权重图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Apply.seam_map }}"
        filename_prefix: "tiled_seam"
        output_dir: "~/flowx-e2e-out"
  SaveInput:
    name: 落盘-输入图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        filename_prefix: "tiled_input"
        output_dir: "~/flowx-e2e-out"
