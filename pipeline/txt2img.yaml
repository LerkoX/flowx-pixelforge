Name: sd-txt2img
Description: ComfyUI 风格文生图：健康检查 → Checkpoint 加载 → CLIP 编码(正/反) → 空 Latent → KSampler → VAE 解码 → 保存图像
Param:
  service_url: "http://127.0.0.1:8100"   # 远程 GPU 机器上的推理服务地址
  service_token: ""                       # 服务端 INFERENCE_TOKEN，未启用鉴权留空
  ckpt_name: "v1-5-pruned-emaonly"        # 推理服务 MODELS_DIR 下的模型文件名（可省略扩展名）
  prompt: "a cute cat sitting on a windowsill, soft light, masterpiece, best quality"
  negative: "lowres, blurry, worst quality, watermark, text"
  width: 512
  height: 512
  seed: -1
  steps: 20
  cfg: 7.0
  sampler: "euler"
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadCheckpoint
    Ensure --> EmptyLatent
    LoadCheckpoint --> EncodePos
    LoadCheckpoint --> EncodeNeg
    EncodePos --> KSampler
    EncodeNeg --> KSampler
    EmptyLatent --> KSampler
    KSampler --> VAEDecode
    VAEDecode --> SaveImage
    SaveImage --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.0.0
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadCheckpoint:
    name: Checkpoint加载
    config:
      nodeRef: checkpoint-loader@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "{{ Param.ckpt_name }}"
  EncodePos:
    name: 正向提示词
    config:
      nodeRef: clip-text-encode@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCheckpoint.clip_ref }}"
        text: "{{ Param.prompt }}"
  EncodeNeg:
    name: 反向提示词
    config:
      nodeRef: clip-text-encode@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCheckpoint.clip_ref }}"
        text: "{{ Param.negative }}"
  EmptyLatent:
    name: 空Latent
    config:
      nodeRef: empty-latent@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        width: "{{ Param.width }}"
        height: "{{ Param.height }}"
        batch_size: 1
  KSampler:
    name: KSampler采样
    config:
      nodeRef: ksampler@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        model_ref: "{{ LoadCheckpoint.model_ref }}"
        positive: "{{ EncodePos.conditioning }}"
        negative: "{{ EncodeNeg.conditioning }}"
        latent: "{{ EmptyLatent.latent }}"
        seed: "{{ Param.seed }}"
        steps: "{{ Param.steps }}"
        cfg: "{{ Param.cfg }}"
        sampler_name: "{{ Param.sampler }}"
        denoise: 1.0
  VAEDecode:
    name: VAE解码
    config:
      nodeRef: vae-decode@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCheckpoint.vae_ref }}"
        latent: "{{ KSampler.latent }}"
  SaveImage:
    name: 保存图像
    config:
      nodeRef: save-image@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ VAEDecode.image }}"
        filename_prefix: "flowx_txt2img"
        output_dir: "~/flowx-output"
