Name: seg-point-e2e-local
Description: B3/G2 SAM 点·框选分割 e2e（全 local 执行器）：加载图 → 装载 SAM → 点选(正样本+负样本)与框选两条 → 落盘蒙版/标注/原图
Param:
  service_url: "https://55999db0.r10.vip.cpolar.cn"
  service_url_host: "https://55999db0.r10.vip.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-input/b3_person.png"
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadImage
    Ensure --> SAMLoad
    LoadImage --> SAMSeg
    SAMLoad --> SAMSeg
    LoadImage --> SAMBox
    SAMLoad --> SAMBox
    SAMSeg --> SaveMask
    SAMSeg --> SaveAnn
    SAMBox --> SaveMaskBox
    LoadImage --> SaveInput
    SaveMask --> [*]
    SaveAnn --> [*]
    SaveMaskBox --> [*]
    SaveInput --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadImage:
    name: 加载原图
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.image_path }}"
  SAMLoad:
    name: 装载 SAM（vit_l）
    config:
      nodeRef: sam-load@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        variant: "vit_l"
        dtype: "fp32"
  SAMSeg:
    name: 点选分割（正+负样本）
    config:
      nodeRef: sam-segment@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        model: "{{ SAMLoad.model }}"
        points: "256,150,1;120,320,0"
        box: ""
        multimask: "true"
        pick: 1
        overlay: 0.5
  SAMBox:
    name: 框选分割
    config:
      nodeRef: sam-segment@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        model: "{{ SAMLoad.model }}"
        points: ""
        box: "80,60,430,330"
        multimask: "false"
        pick: 0
        overlay: 0.5
  SaveMask:
    name: 落盘-点选蒙版
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMSeg.mask }}"
        filename_prefix: "seg_point_mask"
        output_dir: "~/flowx-e2e-out"
  SaveAnn:
    name: 落盘-点选标注图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMSeg.annotated }}"
        filename_prefix: "seg_point_annotated"
        output_dir: "~/flowx-e2e-out"
  SaveMaskBox:
    name: 落盘-框选蒙版
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMBox.mask }}"
        filename_prefix: "seg_box_mask"
        output_dir: "~/flowx-e2e-out"
  SaveInput:
    name: 落盘-输入图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        filename_prefix: "seg_input"
        output_dir: "~/flowx-e2e-out"
