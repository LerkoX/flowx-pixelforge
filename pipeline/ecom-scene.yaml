Name: ecom-scene
Description: B4/S2 G11 电商模板②：场景换底 —— 抠图(lite+去白边) → 背景图合成(羽化 8) → 轻色调统一 → 水印 → 落盘
Param:
  service_url: "http://1bba08c4.r7.cpolar.cn"
  service_url_host: "http://1bba08c4.r7.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-input/b3_person.png"
  bg_path: "~/flowx-input/source.png"
Graph: |
  stateDiagram-v2
  [*] --> Ensure
  Ensure --> LoadImage
  Ensure --> LoadBg
  LoadImage --> Matte
  LoadImage --> Compose
  LoadBg --> Compose
  Matte --> Compose
  Compose --> HSL
  HSL --> WM
  WM --> SaveMain
  Compose --> SaveComposite
  Matte --> SaveMask
  LoadImage --> SaveInput
  SaveMain --> [*]
  SaveComposite --> [*]
  SaveMask --> [*]
  SaveInput --> [*]
Nodes:
  Ensure:
    name: Ensure
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        wait_seconds: 60
        service_token: "{{ Param.service_token }}"
  LoadImage:
    name: LoadImage
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image_path: "{{ Param.image_path }}"
        service_token: "{{ Param.service_token }}"
  LoadBg:
    name: LoadBg
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image_path: "{{ Param.bg_path }}"
        service_token: "{{ Param.service_token }}"
  Matte:
    name: Matte
    config:
      nodeRef: matting-birefnet@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ LoadImage.image }}"
        variant: "lite"
        resolution: 1024
        refine: true
        refine_radius: 60
        alpha_gamma: 1
        invert: false
        service_token: "{{ Param.service_token }}"
  Compose:
    name: Compose
    config:
      nodeRef: matting-composite@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ LoadImage.image }}"
        mask: "{{ Matte.mask }}"
        bg_mode: "image"
        bg_image: "{{ LoadBg.image }}"
        bg_color: "#FFFFFF"
        feather: 8
        service_token: "{{ Param.service_token }}"
  HSL:
    name: HSL
    config:
      nodeRef: image-hsl@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ Compose.image }}"
        hue: 0
        saturation: 1.05
        lightness: 2
        service_token: "{{ Param.service_token }}"
  WM:
    name: WM
    config:
      nodeRef: image-watermark@1.1.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ HSL.image }}"
        text: "FLOWX"
        logo: ""
        position: "bottom-center"
        margin: 24
        opacity: 0.45
        font_size: 0
        font_path: ""
        color: "#FFFFFF"
        stroke_width: 2
        stroke_color: "#000000"
        logo_scale: 0.0
        tile: "false"
        angle: 0
        tile_gap: 0
        service_token: "{{ Param.service_token }}"
  SaveMain:
    name: SaveMain
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ WM.image }}"
        filename_prefix: "ecom_scene_main"
        output_dir: "~/flowx-e2e-out"
        service_token: "{{ Param.service_token }}"
  SaveComposite:
    name: SaveComposite
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ Compose.image }}"
        filename_prefix: "ecom_scene_composite"
        output_dir: "~/flowx-e2e-out"
        service_token: "{{ Param.service_token }}"
  SaveMask:
    name: SaveMask
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ Matte.mask }}"
        filename_prefix: "ecom_scene_mask"
        output_dir: "~/flowx-e2e-out"
        service_token: "{{ Param.service_token }}"
  SaveInput:
    name: SaveInput
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ LoadImage.image }}"
        filename_prefix: "ecom_scene_input"
        output_dir: "~/flowx-e2e-out"
        service_token: "{{ Param.service_token }}"
