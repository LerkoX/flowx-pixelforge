Name: ecom-model-spec
Description: B4/S2 G11 电商模板③：模特图规格化 —— 人脸修复(GFPGAN) / 裁 512² 中心 → RealESRGAN 4x → 水印 → 落盘（GFPGAN 吃的是检测后对齐的人脸块，输入整图即可；裁剪只服务放大分支）
Param:
  service_url: "http://4dc21d2a.r7.cpolar.cn"
  service_url_host: "http://4dc21d2a.r7.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-e2e-out/face_in1_face_sharp_20261011_194659.png"
Graph: |
  stateDiagram-v2
  [*] --> Ensure
  Ensure --> LoadImage
  LoadImage --> FaceRestore
  FaceRestore --> SaveRestored
  LoadImage --> Crop
  Crop --> UpLoad
  UpLoad --> UpApply
  Crop --> UpApply
  UpApply --> WM
  WM --> SaveMain
  Crop --> SaveCrop
  LoadImage --> SaveInput
  SaveMain --> [*]
  SaveRestored --> [*]
  SaveCrop --> [*]
  SaveInput --> [*]
Nodes:
  Ensure:
    name: Ensure
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        wait_seconds: 60
        service_token: "{{ Param.service_token }}"
  LoadImage:
    name: LoadImage
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image_path: "{{ Param.image_path }}"
        service_token: "{{ Param.service_token }}"
  FaceRestore:
    name: FaceRestore
    config:
      nodeRef: face-restore@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ LoadImage.image }}"
        model: "gfpgan"
        upscale: 1.0
        padding: 0.3
        feather: 16
        only_center: true
        max_faces: 1
        det_thresh: 0.5
        service_token: "{{ Param.service_token }}"
  Crop:
    name: Crop
    config:
      nodeRef: image-crop@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ LoadImage.image }}"
        x: 236
        y: 192
        width: 512
        height: 512
        service_token: "{{ Param.service_token }}"
  UpLoad:
    name: UpLoad
    config:
      nodeRef: upscale-model-load@1.1.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        name: "RealESRGAN_x4plus"
        service_token: "{{ Param.service_token }}"
  UpApply:
    name: UpApply
    config:
      nodeRef: upscale-model-apply@1.1.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        upscale_model: "{{ UpLoad.upscale_model }}"
        image: "{{ Crop.image }}"
        tile: 0
        service_token: "{{ Param.service_token }}"
  WM:
    name: WM
    config:
      nodeRef: image-watermark@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ UpApply.image }}"
        text: "FLOWX 2026"
        logo: ""
        position: "bottom-right"
        margin: 24
        opacity: 0.5
        font_size: 0
        font_path: ""
        color: "#FFFFFF"
        stroke_width: 2
        stroke_color: "#000000"
        logo_scale: 0.0
        tile: "false"
        angle: 0
        tile_gap: 0
        service_token: "{{ Param.service_token }}"
  SaveMain:
    name: SaveMain
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ WM.image }}"
        filename_prefix: "ecom_spec_main"
        output_dir: "~/flowx-e2e-out"
        service_token: "{{ Param.service_token }}"
  SaveRestored:
    name: SaveRestored
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ FaceRestore.image }}"
        filename_prefix: "ecom_spec_restored"
        output_dir: "~/flowx-e2e-out"
        service_token: "{{ Param.service_token }}"
  SaveCrop:
    name: SaveCrop
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ Crop.image }}"
        filename_prefix: "ecom_spec_crop"
        output_dir: "~/flowx-e2e-out"
        service_token: "{{ Param.service_token }}"
  SaveInput:
    name: SaveInput
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        image: "{{ LoadImage.image }}"
        filename_prefix: "ecom_spec_input"
        output_dir: "~/flowx-e2e-out"
        service_token: "{{ Param.service_token }}"
