Name: txt2img-depth
Description: >-
  第三档批次3 真机验收：MiDaS 深度图 + depth ControlNet 端到端。
  参考图 = test_fullbody2.jpg（人物照片），preprocess-depth 提取深度图，
  depth ControlNet 锁构图，prompt 换"雪中小屋"——构图/空间层次应跟随深度图。
  验收口径：抽图人工核对（深度图近亮远暗、出图构图跟随）。
Param:
  service_url: "http://192.168.5.60:8100"      # Studio 宿主机/公网可达（local 节点 + 画布侧读取）
  service_url_internal: "http://172.17.0.1:8100"     # docker 节点容器内网地址
  service_token: "30e494999da13134808ee280aea6dffd"  # 服务端 INFERENCE_TOKEN（已启用鉴权）
  ref_image: "~/flowx-output/test_fullbody2.jpg"     # 参考图（FlowX 本机路径）
  seed: 777
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadCkpt
    Ensure --> RefImage
    Ensure --> LoadCN
    LoadCkpt --> EncPos
    LoadCkpt --> EncNeg
    RefImage --> Depth
    LoadCkpt --> ApplyCN
    LoadCN --> ApplyCN
    Depth --> ApplyCN
    Ensure --> EmptyLatent
    LoadCkpt --> Sample
    ApplyCN --> Sample
    EncPos --> Sample
    EncNeg --> Sample
    EmptyLatent --> Sample
    Sample --> Decode
    LoadCkpt --> Decode
    Decode --> Save
    Sample --> UnloadCN
    Save --> [*]
    UnloadCN --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadCkpt:
    name: Checkpoint加载
    config:
      nodeRef: checkpoint-loader@1.2.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "v1-5-pruned-emaonly-fp16"
        dtype: fp16
        offload: none
  EncPos:
    name: 正向提示词
    config:
      nodeRef: clip-text-encode@1.1.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "a small wooden cabin in a snowy forest, night, warm light in the window, highly detailed"
  EncNeg:
    name: 反向提示词
    config:
      nodeRef: clip-text-encode@1.1.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "lowres, blurry, worst quality, watermark, text"
  EmptyLatent:
    name: 空Latent
    config:
      nodeRef: empty-latent@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        width: 512
        height: 512
        batch_size: 1
  RefImage:
    name: 参考图
    config:
      nodeRef: load-image@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.ref_image }}"
  Depth:
    name: 深度提取
    config:
      nodeRef: preprocess-depth@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ RefImage.image }}"
        detect_resolution: 512
  LoadCN:
    name: depth ControlNet
    config:
      nodeRef: controlnet-load@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        name: "control_v11f1p_sd15_depth_fp16"
  ApplyCN:
    name: CN应用
    config:
      nodeRef: controlnet-apply@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        control_net: "{{ LoadCN.control_net }}"
        image: "{{ Depth.image }}"
        strength: 1.0
  Sample:
    name: 采样
    config:
      nodeRef: ksampler@1.4.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model_ref: "{{ LoadCkpt.model_ref }}"
        positive: "{{ EncPos.conditioning }}"
        negative: "{{ EncNeg.conditioning }}"
        latent: "{{ EmptyLatent.latent }}"
        seed: "{{ Param.seed }}"
        steps: 20
        cfg: 7.0
        sampler_name: euler
        scheduler: normal
        denoise: 1.0
        control: "{{ ApplyCN.control }}"
  Decode:
    name: 解码
    config:
      nodeRef: vae-decode@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCkpt.vae_ref }}"
        latent: "{{ Sample.latent }}"
  Save:
    name: 保存
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Decode.image }}"
        filename_prefix: "flowx_depth"
        output_dir: "~/flowx-output"
  UnloadCN:
    name: 卸载模型
    config:
      nodeRef: model-unload@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        target: "all"
