Name: colorize-e2e-local
Description: B4/S1 G8 DDColor 上色 e2e（全 local 执行器）：4 类输入（灰度人像/褪色/偏黄旧照/真人）→ modelscope 变体上色 → 落盘输入+输出（含人脸蒙版定位）
Param:
  service_url: "http://1bba08c4.r7.cpolar.cn"
  service_url_host: "http://1bba08c4.r7.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  gray_path: "~/flowx-input/gray_person.png"
  faded_path: "~/flowx-input/faded.png"
  old_path: "~/flowx-input/old_yellow.png"
  face_path: "~/flowx-input/b4_face_gray.png"
Graph: |
  stateDiagram-v2
  [*] --> Ensure
  Ensure --> CL
  Ensure --> LGray
  LGray --> CGray
  CL --> CGray
  CGray --> SGray
  LGray --> SIGray
  SGray --> [*]
  SIGray --> [*]
  Ensure --> LFaded
  LFaded --> CFaded
  CL --> CFaded
  CFaded --> SFaded
  LFaded --> SIFaded
  SFaded --> [*]
  SIFaded --> [*]
  Ensure --> LOld
  LOld --> COld
  CL --> COld
  COld --> SOld
  LOld --> SIOld
  SOld --> [*]
  SIOld --> [*]
  Ensure --> LFace
  LFace --> CFace
  CL --> CFace
  CFace --> SFace
  LFace --> SIFace
  SFace --> [*]
  SIFace --> [*]
  Ensure --> LFaceM
  LFaceM --> FM
  FM --> SFM
  SFM --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  CL:
    name: 装载 DDColor（modelscope）
    config:
      nodeRef: colorize-load@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        variant: "modelscope"
        dtype: "fp32"
        reload: "false"
  LGray:
    name: 加载原图
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.gray_path }}"
  CGray:
    name: 上色 CGray
    config:
      nodeRef: colorize@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LGray.image }}"
        model: "{{ CL.model }}"
        size: 512
        saturation: 1.0
  SGray:
    name: 落盘-col_gray
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ CGray.image }}"
        filename_prefix: "col_gray"
        output_dir: "~/flowx-e2e-out"
  SIGray:
    name: 落盘-colin_gray
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LGray.image }}"
        filename_prefix: "colin_gray"
        output_dir: "~/flowx-e2e-out"
  LFaded:
    name: 加载原图
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.faded_path }}"
  CFaded:
    name: 上色 CFaded
    config:
      nodeRef: colorize@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LFaded.image }}"
        model: "{{ CL.model }}"
        size: 512
        saturation: 1.0
  SFaded:
    name: 落盘-col_faded
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ CFaded.image }}"
        filename_prefix: "col_faded"
        output_dir: "~/flowx-e2e-out"
  SIFaded:
    name: 落盘-colin_faded
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LFaded.image }}"
        filename_prefix: "colin_faded"
        output_dir: "~/flowx-e2e-out"
  LOld:
    name: 加载原图
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.old_path }}"
  COld:
    name: 上色 COld
    config:
      nodeRef: colorize@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LOld.image }}"
        model: "{{ CL.model }}"
        size: 512
        saturation: 1.0
  SOld:
    name: 落盘-col_old
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ COld.image }}"
        filename_prefix: "col_old"
        output_dir: "~/flowx-e2e-out"
  SIOld:
    name: 落盘-colin_old
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LOld.image }}"
        filename_prefix: "colin_old"
        output_dir: "~/flowx-e2e-out"
  LFace:
    name: 加载原图
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.face_path }}"
  CFace:
    name: 上色 CFace
    config:
      nodeRef: colorize@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LFace.image }}"
        model: "{{ CL.model }}"
        size: 512
        saturation: 1.0
  SFace:
    name: 落盘-col_face
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ CFace.image }}"
        filename_prefix: "col_face"
        output_dir: "~/flowx-e2e-out"
  SIFace:
    name: 落盘-colin_face
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LFace.image }}"
        filename_prefix: "colin_face"
        output_dir: "~/flowx-e2e-out"
  LFaceM:
    name: 加载原图
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.face_path }}"
  FM:
    name: 人脸蒙版（A4 肤色判据定位用）
    config:
      nodeRef: face-mask@1.1.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LFaceM.image }}"
        face_index: 0
        det_thresh: 0.5
        expand: 0.0
        feather: 0
  SFM:
    name: 落盘-col_face_mask
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ FM.mask }}"
        filename_prefix: "col_face_mask"
        output_dir: "~/flowx-e2e-out"
