Name: tripo-sr-e2e
Description: 3D 重建 e2e（dev-plan P2-11）：load-image → TripoSR 单图重建（IMAGE→MESH）→ save-mesh 落盘 GLB。算子与 /ext/meshes 下载端点由 tripo-sr 节点包经插件契约 v2 自注册。
Param:
  service_url: "https://55999db0.r10.vip.cpolar.cn"
  service_url_host: "https://55999db0.r10.vip.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  input_image: "~/flowx-input/chair.png"
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> Load
    Load --> Recon
    Recon --> Save
    Save --> [*]
Nodes:
  Ensure:
    name: 健康检查
    config:
      nodeRef: inference-ensure@1.4.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
  Load:
    name: 读取物体图
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.input_image }}"
  Recon:
    name: TripoSR 重建
    config:
      nodeRef: tripo-sr@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_url_host: "{{ Param.service_url_host }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Load.image }}"
        foreground_ratio: 0.85
        mc_resolution: 256
        format: glb
        vram: keep
  Save:
    name: 保存网格
    config:
      nodeRef: save-mesh@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        mesh: "{{ Recon.mesh }}"
        format: glb
        filename_prefix: "triposr-chair"
