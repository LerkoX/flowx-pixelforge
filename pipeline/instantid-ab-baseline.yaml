Name: instantid-ab-baseline
Description: B5/51.2 InstantID 量化基线（512²/12步快档）（A/B 受控对照）：同一 SDXL 底模、同一参考脸、同一 seed、同一提示词，
  只把身份强度 weight/cn_strength 从 0.8 换成 0.0（官方文档：0=关闭身份/姿态条件）⇒ 用 face.similarity 量身份相似度差
Param:
  service_url: "http://749a0d06.r7.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  ref_path: "~/flowx-output/test_person.jpg"
  seed: 20260926
Graph: |
  stateDiagram-v2
  [*] --> Ensure
  Ensure --> LoadCkpt
  Ensure --> LoadCN
  Ensure --> LoadIPA
  Ensure --> LoadRef
  Ensure --> EmptyLatent
  LoadRef --> FaceAnalyze
  LoadCkpt --> EncPos
  LoadCkpt --> EncNeg
  LoadCkpt --> ApplyON
  LoadIPA --> ApplyON
  LoadCN --> ApplyON
  FaceAnalyze --> ApplyON
  ApplyON --> SampleON
  EncPos --> SampleON
  EncNeg --> SampleON
  EmptyLatent --> SampleON
  SampleON --> DecodeON
  LoadCkpt --> DecodeON
  DecodeON --> SaveON
  LoadCkpt --> ApplyOFF
  LoadIPA --> ApplyOFF
  LoadCN --> ApplyOFF
  FaceAnalyze --> ApplyOFF
  ApplyOFF --> SampleOFF
  EncPos --> SampleOFF
  EncNeg --> SampleOFF
  EmptyLatent --> SampleOFF
  SampleOFF --> DecodeOFF
  LoadCkpt --> DecodeOFF
  DecodeOFF --> SaveOFF
  LoadRef --> SaveRef
  SaveON --> [*]
  SaveOFF --> [*]
  SaveRef --> [*]
Nodes:
  Ensure:
    name: Ensure
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadCkpt:
    name: LoadCkpt
    config:
      nodeRef: checkpoint-loader@1.4.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        service_url_host: "{{ Param.service_url }}"
        ckpt_name: "sd_xl_base_1.0"
        dtype: "fp16"
        offload: "model"
  LoadCN:
    name: LoadCN
    config:
      nodeRef: controlnet-load@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        service_url_host: "{{ Param.service_url }}"
        name: "instantid-controlnet"
  LoadIPA:
    name: LoadIPA
    config:
      nodeRef: ipadapter-load@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        service_url_host: "{{ Param.service_url }}"
        name: "instantid-ip-adapter"
  LoadRef:
    name: LoadRef
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.ref_path }}"
  FaceAnalyze:
    name: FaceAnalyze
    config:
      nodeRef: instantid-face-analyze@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        service_url_host: "{{ Param.service_url }}"
        image: "{{ LoadRef.image }}"
        face_index: -1
        canvas_width: 512
        canvas_height: 512
        canvas_mode: "cover"
  EncPos:
    name: EncPos
    config:
      nodeRef: clip-text-encode@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "portrait photo of a 30 year old woman, looking at camera, plain grey background, studio lighting, highly detailed, masterpiece, best quality"
  EncNeg:
    name: EncNeg
    config:
      nodeRef: clip-text-encode@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "(lowres, low quality, worst quality:1.2), watermark, text, deformed, mutated, ugly, disfigured"
  EmptyLatent:
    name: EmptyLatent
    config:
      nodeRef: empty-latent@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        width: 512
        height: 512
        batch_size: 1
  ApplyON:
    name: ApplyON
    config:
      nodeRef: instantid-apply@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        service_url_host: "{{ Param.service_url }}"
        model: "{{ LoadCkpt.model_ref }}"
        ipadapter: "{{ LoadIPA.ipadapter }}"
        controlnet: "{{ LoadCN.control_net }}"
        face: "{{ FaceAnalyze.face }}"
        weight: 0.8
        cn_strength: 0.8
  SampleON:
    name: SampleON
    config:
      nodeRef: ksampler@1.5.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        service_url_host: "{{ Param.service_url }}"
        model_ref: "{{ ApplyON.model }}"
        positive: "{{ EncPos.conditioning }}"
        negative: "{{ EncNeg.conditioning }}"
        latent: "{{ EmptyLatent.latent }}"
        seed: "{{ Param.seed }}"
        steps: 12
        cfg: 5.0
        sampler_name: "euler"
        scheduler: "normal"
        denoise: 1.0
        control: "{{ ApplyON.control }}"
  DecodeON:
    name: DecodeON
    config:
      nodeRef: vae-decode@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCkpt.vae_ref }}"
        latent: "{{ SampleON.latent }}"
  SaveON:
    name: SaveON
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ DecodeON.image }}"
        filename_prefix: "iidp_on"
        output_dir: "~/flowx-e2e-out"
  ApplyOFF:
    name: ApplyOFF
    config:
      nodeRef: instantid-apply@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        service_url_host: "{{ Param.service_url }}"
        model: "{{ LoadCkpt.model_ref }}"
        ipadapter: "{{ LoadIPA.ipadapter }}"
        controlnet: "{{ LoadCN.control_net }}"
        face: "{{ FaceAnalyze.face }}"
        weight: 0.0
        cn_strength: 0.0
  SampleOFF:
    name: SampleOFF
    config:
      nodeRef: ksampler@1.5.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        service_url_host: "{{ Param.service_url }}"
        model_ref: "{{ ApplyOFF.model }}"
        positive: "{{ EncPos.conditioning }}"
        negative: "{{ EncNeg.conditioning }}"
        latent: "{{ EmptyLatent.latent }}"
        seed: "{{ Param.seed }}"
        steps: 12
        cfg: 5.0
        sampler_name: "euler"
        scheduler: "normal"
        denoise: 1.0
        control: "{{ ApplyOFF.control }}"
  DecodeOFF:
    name: DecodeOFF
    config:
      nodeRef: vae-decode@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCkpt.vae_ref }}"
        latent: "{{ SampleOFF.latent }}"
  SaveOFF:
    name: SaveOFF
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ DecodeOFF.image }}"
        filename_prefix: "iidp_off"
        output_dir: "~/flowx-e2e-out"
  SaveRef:
    name: SaveRef
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadRef.image }}"
        filename_prefix: "iidp_ref"
        output_dir: "~/flowx-e2e-out"
