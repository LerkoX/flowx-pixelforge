Name: video-v2v-repaint
Description: >-
  视频到视频（逐帧重绘）：跳舞视频换人 / 视频转绘模板。
  加载源视频 → Checkpoint 加载 → 文本条件（正/负）→ IPAdapter 注入参考人物
  （ipadapter-apply 的 model 输出，采样每步生效）→ video-repaint 逐帧重绘
  （低 strength 保姿态换外观）→ 保存 mp4。
  ⚠️ 逐帧重绘耗时 = 帧数 × 单帧耗时：先用 max_frames=8 小样验证效果再放开全片。
  ⚠️ 形态判据：验收务必抽帧看图（视频管线只验状态不算过）。
Param:
  service_url: "http://192.168.5.60:8100"              # Studio 宿主机/公网可达（local 节点 + 画布侧读取）
  service_url_internal: "http://172.17.0.1:8100"       # docker 节点容器内网地址
  service_token: "30e494999da13134808ee280aea6dffd"   # 服务端 INFERENCE_TOKEN（已启用鉴权；换部署改这里）
  source_video: "~/flowx-input/uploads/dance.mp4"       # 源视频（FlowX 本机路径）
  ref_image: "~/flowx-input/uploads/character.png"      # 目标人物参考图（换人）
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadVideo
    Ensure --> LoadCkpt
    Ensure --> RefImage
    Ensure --> LoadCV
    LoadCkpt --> LoadIPA
    LoadVideo --> Repaint
    LoadCkpt --> EncPos
    LoadCkpt --> EncNeg
    EncPos --> Repaint
    EncNeg --> Repaint
    LoadIPA --> ApplyIPA
    LoadCV --> ApplyIPA
    RefImage --> ApplyIPA
    LoadCkpt --> ApplyIPA
    ApplyIPA --> Repaint
    Repaint --> SaveVideo
    SaveVideo --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadVideo:
    name: 加载源视频
    config:
      nodeRef: load-video@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        video_path: "{{ Param.source_video }}"
        max_frames: 8          # 小样验证：确认换人效果后再改 0（全片）
        fps: 8                 # 降采样到 8fps（逐帧重绘耗时与帧数成正比）
        width: 512             # 缩到 512 宽（SD1.5 甜点尺寸，同时压耗时）
        height: 0
  LoadCkpt:
    name: Checkpoint加载
    config:
      nodeRef: checkpoint-loader@1.4.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "v1-5-pruned-emaonly-fp16"
        dtype: fp16
        offload: none
  EncPos:
    name: 正向提示词
    config:
      nodeRef: clip-text-encode@1.3.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "a woman dancing, cinematic lighting, detailed face, best quality"
  EncNeg:
    name: 反向提示词
    config:
      nodeRef: clip-text-encode@1.3.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "lowres, blurry, worst quality, watermark, text, extra limbs"
  RefImage:
    name: 人物参考图
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.ref_image }}"
  LoadCV:
    name: CLIP Vision加载
    config:
      nodeRef: clip-vision-load@1.3.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        name: "CLIP-ViT-H-14"
  LoadIPA:
    name: IPAdapter加载
    config:
      nodeRef: ipadapter-load@1.2.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        name: "ip-adapter_sd15"
  ApplyIPA:
    name: IPA注入参考人物
    config:
      nodeRef: ipadapter-apply@1.1.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model: "{{ LoadCkpt.model_ref }}"
        ipadapter: "{{ LoadIPA.ipadapter }}"
        clip_vision: "{{ LoadCV.clip_vision }}"
        image: "{{ RefImage.image }}"
        weight: 0.8
        start_percent: 0.0
        end_percent: 1.0
  Repaint:
    name: 逐帧重绘
    config:
      nodeRef: video-repaint@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model: "{{ ApplyIPA.model }}"
        pos: "{{ EncPos.conditioning }}"
        neg: "{{ EncNeg.conditioning }}"
        video: "{{ LoadVideo.video }}"
        strength: 0.55         # 有效去噪步数 ≈ steps−round(steps×(1−strength)) = 11
        steps: 20              # 配比 <2 几乎不重绘（算子日志会报有效步数）
        cfg: 7.0
        seed: -1
        preview_every: 1
        job_timeout: 7200
  SaveVideo:
    name: 保存视频
    config:
      nodeRef: save-video@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        video: "{{ Repaint.video }}"
        filename_prefix: "flowx_v2v_repaint"
        output_dir: "~/flowx-output"
