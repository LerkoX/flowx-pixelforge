Name: txt2img-ipadapter-sdxl
Description: >-
  SDXL IPAdapter（vit-h 变体）Studio e2e 验收：参考图 = 橘白卡通猫窗台图，
  prompt = "a dog sitting in a garden, photograph"。weight=0.8 全程注入，
  出图应向参考图风格/构图漂移（橘白猫窗台插画风）。768x768 / 16 步 /
  offload=model。
Param:
  service_url: "http://192.168.5.60:8100"      # Studio 宿主机/公网可达（local 节点 + 画布侧读取）
  service_url_internal: "http://172.17.0.1:8100"     # docker 节点容器内网地址
  service_token: "30e494999da13134808ee280aea6dffd"  # 服务端 INFERENCE_TOKEN（已启用鉴权）
  ref_image: "~/flowx-output/flowx_txt2img_20260922_170318.png"  # 参考图（FlowX 本机路径）
  seed: 42
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadCkpt
    Ensure --> RefImage
    Ensure --> LoadCV
    Ensure --> LoadIPA
    LoadCkpt --> EncPos
    LoadCkpt --> EncNeg
    Ensure --> EmptyLatent
    LoadCkpt --> ApplyIPA
    LoadIPA --> ApplyIPA
    LoadCV --> ApplyIPA
    RefImage --> ApplyIPA
    ApplyIPA --> Sample
    EncPos --> Sample
    EncNeg --> Sample
    EmptyLatent --> Sample
    Sample --> Decode
    LoadCkpt --> Decode
    Decode --> Save
    Save --> Unload
    Unload --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
        min_vram_mb: 6000
  LoadCkpt:
    name: SDXL加载
    config:
      nodeRef: checkpoint-loader@1.2.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "sd_xl_base_1.0"
        dtype: fp16
        offload: model
  EncPos:
    name: 正向提示词
    config:
      nodeRef: clip-text-encode@1.1.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "a dog sitting in a garden, photograph, high quality, sharp focus"
        width: 768
        height: 768
  EncNeg:
    name: 反向提示词
    config:
      nodeRef: clip-text-encode@1.1.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "lowres, blurry, worst quality, watermark, text"
        width: 768
        height: 768
  EmptyLatent:
    name: 空Latent
    config:
      nodeRef: empty-latent@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        width: 768
        height: 768
        batch_size: 1
  RefImage:
    name: 参考图
    config:
      nodeRef: load-image@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.ref_image }}"
  LoadCV:
    name: CLIP Vision加载
    config:
      nodeRef: clip-vision-load@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        name: "CLIP-ViT-H-14"
  LoadIPA:
    name: SDXL IPA加载
    config:
      nodeRef: ipadapter-load@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        name: "ip-adapter_sdxl_vit-h"
  ApplyIPA:
    name: IPA应用
    config:
      nodeRef: ipadapter-apply@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model: "{{ LoadCkpt.model_ref }}"
        ipadapter: "{{ LoadIPA.ipadapter }}"
        clip_vision: "{{ LoadCV.clip_vision }}"
        image: "{{ RefImage.image }}"
        weight: 0.8
        start_percent: 0.0
        end_percent: 1.0
  Sample:
    name: 采样
    config:
      nodeRef: ksampler@1.4.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model_ref: "{{ ApplyIPA.model }}"
        positive: "{{ EncPos.conditioning }}"
        negative: "{{ EncNeg.conditioning }}"
        latent: "{{ EmptyLatent.latent }}"
        seed: "{{ Param.seed }}"
        steps: 16
        cfg: 7.0
        sampler_name: euler
        scheduler: normal
        denoise: 1.0
  Decode:
    name: 解码
    config:
      nodeRef: vae-decode@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCkpt.vae_ref }}"
        latent: "{{ Sample.latent }}"
  Save:
    name: 保存
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Decode.image }}"
        filename_prefix: "flowx_ipa_sdxl"
        output_dir: "~/flowx-output"
  Unload:
    name: 卸载模型
    config:
      nodeRef: model-unload@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_token: "{{ Param.service_token }}"
        target: "all"
