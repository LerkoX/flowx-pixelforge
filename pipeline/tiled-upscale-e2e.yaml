Name: tiled-upscale-e2e
Description: B3/G4 分块重绘超分 e2e（docker 执行器跑推理 + 手机侧落盘）：验证执行器无关与固定种子可复现
Param:
  service_url: "http://172.17.0.1:8100"
  # save-image / load-image 等 local 执行器节点在手机侧跑，必须用手机可达地址
  service_url_local: "http://1bba08c4.r7.cpolar.cn"   # 手机侧可达（蜂窝网走 http 隧道，保留鉴权头）
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-input/b3_person.png"
Graph: |
  stateDiagram-v2
    [*] --> LoadImage
    LoadImage --> Plan
    CKPT --> Pos
    CKPT --> Neg
    Plan --> Apply
    CKPT --> Apply
    Pos --> Apply
    Neg --> Apply
    LoadImage --> Apply
    Apply --> SaveUp
    Apply --> SavePre
    Apply --> SaveSeam
    LoadImage --> SaveInput
    SaveUp --> [*]
    SavePre --> [*]
    SaveSeam --> [*]
    SaveInput --> [*]
Nodes:
  LoadImage:
    name: 加载原图（手机侧上传）
    config:
      nodeRef: load-image@1.4.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.image_path }}"
  Plan:
    name: 切片规划（容器内）
    config:
      nodeRef: tiled-upscale-plan@1.0.0
      executor: docker
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        scale: 2.0
        target_w: 0
        target_h: 0
        tile: 512
        overlap: 64
        pre: "lanczos"
        denoise: 0.35
        seed: 12345
        seam_fix: "mask"
        band_denoise: 0.25
        steps: 8
  CKPT:
    name: Checkpoint 加载（容器内）
    config:
      nodeRef: checkpoint-loader@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_url_host: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "v1-5-pruned-emaonly"
  Pos:
    name: 正向提示词（容器内）
    config:
      nodeRef: clip-text-encode@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ CKPT.clip_ref }}"
        text: "a photo of a person, sharp focus, highly detailed skin and fabric texture"
  Neg:
    name: 反向提示词（容器内）
    config:
      nodeRef: clip-text-encode@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ CKPT.clip_ref }}"
        text: "lowres, blurry, worst quality, watermark, text, jpeg artifacts"
  Apply:
    name: 分块重绘（容器内）
    config:
      nodeRef: tiled-upscale-apply@1.0.0
      executor: docker
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        model: "{{ CKPT.model_ref }}"
        pos: "{{ Pos.conditioning }}"
        neg: "{{ Neg.conditioning }}"
        plan: "{{ Plan.plan }}"
        tile: 512
        overlap: 64
        scale: 2.0
        target_w: 0
        target_h: 0
        pre: "lanczos"
        denoise: 0.35
        seed: 12345
        seam_fix: "mask"
        band_denoise: 0.25
        steps: 8
        cfg: 7.0
        sampler_name: ""
        scheduler: "normal"
  SaveUp:
    name: 落盘-超分结果
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Apply.image }}"
        filename_prefix: "tiledd_up"
        output_dir: "~/flowx-e2e-out"
  SavePre:
    name: 落盘-预放大图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Apply.pre_upscaled }}"
        filename_prefix: "tiledd_pre"
        output_dir: "~/flowx-e2e-out"
  SaveSeam:
    name: 落盘-接缝权重图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Apply.seam_map }}"
        filename_prefix: "tiledd_seam"
        output_dir: "~/flowx-e2e-out"
  SaveInput:
    name: 落盘-输入图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        filename_prefix: "tiledd_input"
        output_dir: "~/flowx-e2e-out"
