Name: seg-point-e2e
Description: B3/G2 SAM 点·框选分割 e2e（docker 执行器跑推理 + 手机侧落盘）：验证执行器无关（与 local 版逐字节一致）
Param:
  service_url: "http://172.17.0.1:8100"
  # save-image / load-image 等 local 执行器节点在手机侧跑，必须用手机可达地址
  service_url_local: "http://1bba08c4.r7.cpolar.cn"   # 手机侧可达（蜂窝网走 http 隧道，保留鉴权头）
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-input/b3_person.png"
Graph: |
  stateDiagram-v2
    [*] --> LoadImage
    LoadImage --> SAMLoad
    SAMLoad --> SAMSeg
    LoadImage --> SAMSeg
    SAMLoad --> SAMBox
    LoadImage --> SAMBox
    SAMSeg --> SaveMask
    SAMSeg --> SaveAnn
    SAMBox --> SaveMaskBox
    LoadImage --> SaveInput
    SaveMask --> [*]
    SaveAnn --> [*]
    SaveMaskBox --> [*]
    SaveInput --> [*]
Nodes:
  LoadImage:
    name: 加载原图（手机侧上传）
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.image_path }}"
  SAMLoad:
    name: 装载 SAM（vit_l，容器内）
    config:
      nodeRef: sam-load@1.0.0
      executor: docker
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        variant: "vit_l"
        dtype: "fp32"
  SAMSeg:
    name: 点选分割（容器内）
    config:
      nodeRef: sam-segment@1.0.0
      executor: docker
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        model: "{{ SAMLoad.model }}"
        points: "256,150,1;120,320,0"
        box: ""
        multimask: "true"
        pick: 1
        overlay: 0.5
  SAMBox:
    name: 框选分割（容器内）
    config:
      nodeRef: sam-segment@1.0.0
      executor: docker
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        model: "{{ SAMLoad.model }}"
        points: ""
        box: "80,60,430,330"
        multimask: "false"
        pick: 0
        overlay: 0.5
  SaveMask:
    name: 落盘-点选蒙版
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMSeg.mask }}"
        filename_prefix: "segd_point_mask"
        output_dir: "~/flowx-e2e-out"
  SaveAnn:
    name: 落盘-点选标注图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMSeg.annotated }}"
        filename_prefix: "segd_point_annotated"
        output_dir: "~/flowx-e2e-out"
  SaveMaskBox:
    name: 落盘-框选蒙版
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SAMBox.mask }}"
        filename_prefix: "segd_box_mask"
        output_dir: "~/flowx-e2e-out"
  SaveInput:
    name: 落盘-输入图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url_local }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadImage.image }}"
        filename_prefix: "segd_input"
        output_dir: "~/flowx-e2e-out"
