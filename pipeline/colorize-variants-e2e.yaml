Name: colorize-variants-e2e
Description: B4/S1 G8 变体对照 e2e：同一张褪色图过 4 个 DDColor 变体（modelscope/paper/artistic/paper_tiny）→ 落盘 4 份结果，验证 sha 互异与各自确定性
Param:
  service_url: "http://4dc21d2a.r7.cpolar.cn"
  service_url_host: "http://4dc21d2a.r7.cpolar.cn"
  service_token: "30e494999da13134808ee280aea6dffd"
  image_path: "~/flowx-input/faded.png"
Graph: |
  stateDiagram-v2
  [*] --> Ensure
  Ensure --> LIn
  Ensure --> CL_modelscope
  CL_modelscope --> C_modelscope
  LIn --> C_modelscope
  C_modelscope --> S_modelscope
  S_modelscope --> [*]
  Ensure --> CL_paper
  CL_paper --> C_paper
  LIn --> C_paper
  C_paper --> S_paper
  S_paper --> [*]
  Ensure --> CL_artistic
  CL_artistic --> C_artistic
  LIn --> C_artistic
  C_artistic --> S_artistic
  S_artistic --> [*]
  Ensure --> CL_paper_tiny
  CL_paper_tiny --> C_paper_tiny
  LIn --> C_paper_tiny
  C_paper_tiny --> S_paper_tiny
  S_paper_tiny --> [*]
  LIn --> SIn
  SIn --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LIn:
    name: 加载原图
    config:
      nodeRef: load-image@1.3.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "{{ Param.image_path }}"
  CL_modelscope:
    name: 装载 DDColor（modelscope）
    config:
      nodeRef: colorize-load@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        variant: "modelscope"
        dtype: "fp32"
        reload: "false"
  C_modelscope:
    name: 上色 C_modelscope
    config:
      nodeRef: colorize@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LIn.image }}"
        model: "{{ CL_modelscope.model }}"
        size: 512
        saturation: 1.0
  S_modelscope:
    name: 落盘-colv_modelscope
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ C_modelscope.image }}"
        filename_prefix: "colv_modelscope"
        output_dir: "~/flowx-e2e-out"
  CL_paper:
    name: 装载 DDColor（paper）
    config:
      nodeRef: colorize-load@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        variant: "paper"
        dtype: "fp32"
        reload: "false"
  C_paper:
    name: 上色 C_paper
    config:
      nodeRef: colorize@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LIn.image }}"
        model: "{{ CL_paper.model }}"
        size: 512
        saturation: 1.0
  S_paper:
    name: 落盘-colv_paper
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ C_paper.image }}"
        filename_prefix: "colv_paper"
        output_dir: "~/flowx-e2e-out"
  CL_artistic:
    name: 装载 DDColor（artistic）
    config:
      nodeRef: colorize-load@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        variant: "artistic"
        dtype: "fp32"
        reload: "false"
  C_artistic:
    name: 上色 C_artistic
    config:
      nodeRef: colorize@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LIn.image }}"
        model: "{{ CL_artistic.model }}"
        size: 512
        saturation: 1.0
  S_artistic:
    name: 落盘-colv_artistic
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ C_artistic.image }}"
        filename_prefix: "colv_artistic"
        output_dir: "~/flowx-e2e-out"
  CL_paper_tiny:
    name: 装载 DDColor（paper_tiny）
    config:
      nodeRef: colorize-load@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        variant: "paper_tiny"
        dtype: "fp32"
        reload: "false"
  C_paper_tiny:
    name: 上色 C_paper_tiny
    config:
      nodeRef: colorize@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LIn.image }}"
        model: "{{ CL_paper_tiny.model }}"
        size: 512
        saturation: 1.0
  S_paper_tiny:
    name: 落盘-colv_paper_tiny
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ C_paper_tiny.image }}"
        filename_prefix: "colv_paper_tiny"
        output_dir: "~/flowx-e2e-out"
  SIn:
    name: 落盘-colv_input
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LIn.image }}"
        filename_prefix: "colv_input"
        output_dir: "~/flowx-e2e-out"
