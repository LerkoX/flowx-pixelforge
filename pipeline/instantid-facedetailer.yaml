Name: instantid-facedetailer
Description: >-
  InstantID × FaceDetailer 联动（D1，纯编排零代码）：参考人脸 → face.analyze
  身份特征+关键点 → InstantID(SDXL 768/16 快档) 换脸生成 → face-mask 定位 → 裁剪放大 →
  低 denoise 精修重采样(放大 1.25x,WSL 内存红线) → 羽化贴回。验收口径：身份相似度保持（脸还是参考脸）
  + 面部清晰度提升 + mask 外逐像素不变。
Param:
  service_url: "http://192.168.5.60:8100"      # Studio 宿主机/公网可达（local 节点 + 画布侧读取）
  service_url_internal: "http://172.17.0.1:8100"     # docker 节点容器内网地址
  service_token: "30e494999da13134808ee280aea6dffd"  # 服务端 INFERENCE_TOKEN（已启用鉴权）
  seed: 20260926
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadCkpt
    Ensure --> LoadCN
    Ensure --> LoadIPA
    Ensure --> LoadRef
    LoadCkpt --> EncPos
    LoadCkpt --> EncNeg
    LoadRef --> FaceAnalyze
    LoadCkpt --> Apply
    LoadIPA --> Apply
    LoadCN --> Apply
    FaceAnalyze --> Apply
    FaceAnalyze --> SaveKps
    Ensure --> EmptyLatent
    Apply --> Sample0
    EncPos --> Sample0
    EncNeg --> Sample0
    EmptyLatent --> Sample0
    Sample0 --> Decode0
    LoadCkpt --> Decode0
    Decode0 --> SaveOrig
    Decode0 --> FaceMask
    Decode0 --> UnloadCN
    Decode0 --> Crop
    FaceMask --> Crop
    Crop --> Upscale
    UnloadCN --> VaeEncode
    LoadCkpt --> VaeEncode
    Upscale --> VaeEncode
    LoadCkpt --> EncFix
    VaeEncode --> SampleFix
    EncFix --> SampleFix
    EncNeg --> SampleFix
    LoadCkpt --> SampleFix
    Apply --> SampleFix
    SampleFix --> DecodeFix
    LoadCkpt --> DecodeFix
    DecodeFix --> Downscale
    FaceMask --> Downscale
    FaceMask --> MaskCrop
    Decode0 --> Composite
    Downscale --> Composite
    MaskCrop --> Composite
    Composite --> Save
    Save --> Unload
    SaveKps --> [*]
    SaveOrig --> [*]
    Unload --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadCkpt:
    name: SDXL加载
    config:
      nodeRef: checkpoint-loader@1.3.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "sd_xl_base_1.0"
        dtype: fp16
        offload: model
  LoadCN:
    name: InstantID-CN加载
    config:
      nodeRef: controlnet-load@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        name: "instantid-controlnet"
  LoadIPA:
    name: InstantID-IPA加载
    config:
      nodeRef: ipadapter-load@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        name: "instantid-ip-adapter"
  LoadRef:
    name: 参考人脸
    config:
      nodeRef: load-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image_path: "~/flowx-output/test_person.jpg"
  FaceAnalyze:
    name: 人脸分析
    config:
      nodeRef: instantid-face-analyze@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ LoadRef.image }}"
        face_index: -1
        canvas_width: 768   # kps 画在生成画布上（等比+居中），修人脸几何压扁
        canvas_height: 768  # 参考图 768×1152 与生成 768×768 比例不一致时必须启用
        canvas_mode: cover  # 铺满裁溢出：人脸保持参考原尺度（身份 sim 优于 fit/letterbox）
  SaveKps:
    name: 保存kps预览
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ FaceAnalyze.kps }}"
        filename_prefix: "flowx_iid_fd_kps"
        output_dir: "~/flowx-output"
  EncPos:
    name: 正向提示词
    config:
      nodeRef: clip-text-encode@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "portrait photo of an astronaut wearing a spacesuit, studio lighting, highly detailed, masterpiece, best quality"
  EncNeg:
    name: 反向提示词
    config:
      nodeRef: clip-text-encode@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "(lowres, low quality, worst quality:1.2), watermark, text, deformed, mutated, ugly, disfigured"
  Apply:
    name: InstantID应用
    config:
      nodeRef: instantid-apply@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model: "{{ LoadCkpt.model_ref }}"
        ipadapter: "{{ LoadIPA.ipadapter }}"
        controlnet: "{{ LoadCN.control_net }}"
        face: "{{ FaceAnalyze.face }}"
        weight: 0.8
        cn_strength: 0.8
  EmptyLatent:
    name: 空Latent
    config:
      nodeRef: empty-latent@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        width: 768
        height: 768
        batch_size: 1
  Sample0:
    name: InstantID采样
    config:
      nodeRef: ksampler@1.5.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model_ref: "{{ Apply.model }}"
        positive: "{{ EncPos.conditioning }}"
        negative: "{{ EncNeg.conditioning }}"
        latent: "{{ EmptyLatent.latent }}"
        seed: "{{ Param.seed }}"
        steps: 16
        cfg: 5.0
        sampler_name: euler
        scheduler: normal
        denoise: 1.0
        control: "{{ Apply.control }}"
  Decode0:
    name: 解码原图
    config:
      nodeRef: vae-decode@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCkpt.vae_ref }}"
        latent: "{{ Sample0.latent }}"
  SaveOrig:
    name: 保存原图
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Decode0.image }}"
        filename_prefix: "flowx_iid_fd_orig"
        output_dir: "~/flowx-output"
  FaceMask:
    name: 人脸蒙版
    config:
      nodeRef: face-mask@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Decode0.image }}"
        face_index: -1
        det_thresh: 0.2
        expand: 0.6
        feather: 16
  Crop:
    name: 裁剪脸部
    config:
      nodeRef: image-crop@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Decode0.image }}"
        x: "{{ FaceMask.x }}"
        y: "{{ FaceMask.y }}"
        width: "{{ FaceMask.width }}"
        height: "{{ FaceMask.height }}"
  Upscale:
    name: 放大crop
    config:
      nodeRef: image-upscale@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Crop.image }}"
        scale: 1.25
        method: lanczos
  VaeEncode:
    name: VAE编码
    config:
      nodeRef: vae-encode@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCkpt.vae_ref }}"
        image: "{{ Upscale.image }}"
  EncFix:
    name: 精修提示词
    config:
      nodeRef: clip-text-encode@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCkpt.clip_ref }}"
        text: "portrait photo of an astronaut wearing a spacesuit, studio lighting, highly detailed, masterpiece, best quality, beautiful detailed face, sharp focus, detailed eyes, natural skin texture"
  SampleFix:
    name: 精修采样
    config:
      nodeRef: ksampler@1.5.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model_ref: "{{ Apply.model }}"
        positive: "{{ EncFix.conditioning }}"
        negative: "{{ EncNeg.conditioning }}"
        latent: "{{ VaeEncode.latent }}"
        seed: "{{ Param.seed }}"
        steps: 16
        cfg: 5.0
        sampler_name: euler
        scheduler: normal
        denoise: 0.35
  DecodeFix:
    name: 解码精修
    config:
      nodeRef: vae-decode@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCkpt.vae_ref }}"
        latent: "{{ SampleFix.latent }}"
  Downscale:
    name: 缩回原尺寸
    config:
      nodeRef: image-upscale@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ DecodeFix.image }}"
        width: "{{ FaceMask.width }}"
        height: "{{ FaceMask.height }}"
        method: lanczos
  MaskCrop:
    name: 裁剪蒙版
    config:
      nodeRef: image-crop@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ FaceMask.mask }}"
        x: "{{ FaceMask.x }}"
        y: "{{ FaceMask.y }}"
        width: "{{ FaceMask.width }}"
        height: "{{ FaceMask.height }}"
  Composite:
    name: 贴回
    config:
      nodeRef: image-composite@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        background: "{{ Decode0.image }}"
        foreground: "{{ Downscale.image }}"
        mask: "{{ MaskCrop.image }}"
        x: "{{ FaceMask.x }}"
        y: "{{ FaceMask.y }}"
  Save:
    name: 保存精修
    config:
      nodeRef: save-image@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ Composite.image }}"
        filename_prefix: "flowx_iid_fd_fixed"
        output_dir: "~/flowx-output"
  UnloadCN:
    name: 卸载InstantID-CN(精修不再需要)
    config:
      nodeRef: model-unload@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        target: "cn:instantid-controlnet"
  Unload:
    name: 卸载模型
    config:
      nodeRef: model-unload@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        target: "all"
