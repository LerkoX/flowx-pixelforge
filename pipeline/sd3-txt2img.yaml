Name: sd3-txt2img
Description: SD3.5 Medium 文生图（MMDiT 新架构，dev-plan 9.6 MVP）：健康检查 → Checkpoint 加载（默认弃 T5-XXL）→ SD3.5 采样（管道全包）→ 保存图像
Param:
  service_url: "http://127.0.0.1:8100"   # 推理服务地址（cpolar 隧道每次重建会变，跑前更新）
  service_token: ""                       # 服务端 INFERENCE_TOKEN，未启用鉴权留空
  ckpt_name: "sd3.5-medium"               # MODELS_DIR 下的 SD3.5 diffusers 目录名
  prompt: "a cute cat sitting on a windowsill, soft light, masterpiece, best quality"
  negative: "lowres, blurry, worst quality, watermark, text"
  width: 512
  height: 512
  seed: -1
  steps: 28
  cfg: 4.5
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadCheckpoint
    LoadCheckpoint --> SD3Sample
    SD3Sample --> SaveImage
    SaveImage --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.0.0
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadCheckpoint:
    name: SD3.5加载
    config:
      nodeRef: checkpoint-loader@1.1.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "{{ Param.ckpt_name }}"
  SD3Sample:
    name: SD3.5采样
    config:
      nodeRef: sd3-txt2img@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        model_ref: "{{ LoadCheckpoint.model_ref }}"
        prompt: "{{ Param.prompt }}"
        negative_prompt: "{{ Param.negative }}"
        width: "{{ Param.width }}"
        height: "{{ Param.height }}"
        seed: "{{ Param.seed }}"
        steps: "{{ Param.steps }}"
        cfg: "{{ Param.cfg }}"
  SaveImage:
    name: 保存图像
    config:
      nodeRef: save-image@1.1.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SD3Sample.image }}"
        filename_prefix: "flowx_sd3"
        output_dir: "~/flowx-output"
