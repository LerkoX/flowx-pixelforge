Name: sd3-txt2img
Description: SD3.5 Medium 文生图细分链（dev-plan 9.6 细分版）：健康检查 → Checkpoint 加载 → CLIP 编码(正/反) → 空 Latent(16ch) → SD3 采样器 → VAE 解码 → 保存图像
Param:
  service_url: "http://127.0.0.1:8100"   # 推理服务地址（公共参数：全节点共享）
  service_token: ""                       # 服务端 INFERENCE_TOKEN（公共参数）
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadCheckpoint
    Ensure --> EmptyLatent
    LoadCheckpoint --> EncodePos
    LoadCheckpoint --> EncodeNeg
    EncodePos --> SD3Sampler
    EncodeNeg --> SD3Sampler
    EmptyLatent --> SD3Sampler
    SD3Sampler --> SD3Decode
    SD3Decode --> SaveImage
    SaveImage --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.0.0
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadCheckpoint:
    name: SD3.5加载
    config:
      nodeRef: checkpoint-loader@1.1.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "sd3.5-medium"
  EncodePos:
    name: 正向提示词
    config:
      nodeRef: sd3-clip-encode@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCheckpoint.clip_ref }}"
        text: "a cute cat sitting on a windowsill, soft light, masterpiece, best quality"
  EncodeNeg:
    name: 反向提示词
    config:
      nodeRef: sd3-clip-encode@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        clip_ref: "{{ LoadCheckpoint.clip_ref }}"
        text: "lowres, blurry, worst quality, watermark, text"
  EmptyLatent:
    name: 空Latent
    config:
      nodeRef: sd3-empty-latent@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        width: 512
        height: 512
        batch_size: 1
  SD3Sampler:
    name: SD3采样器
    config:
      nodeRef: sd3-sampler@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        model_ref: "{{ LoadCheckpoint.model_ref }}"
        positive: "{{ EncodePos.cond }}"
        negative: "{{ EncodeNeg.cond }}"
        latent: "{{ EmptyLatent.latent }}"
        seed: -1
        steps: 28
        cfg: 4.5
        denoise: 1.0
  SD3Decode:
    name: VAE解码
    config:
      nodeRef: sd3-vae-decode@1.0.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        vae_ref: "{{ LoadCheckpoint.vae_ref }}"
        latent: "{{ SD3Sampler.latent }}"
  SaveImage:
    name: 保存图像
    config:
      nodeRef: save-image@1.1.0
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        image: "{{ SD3Decode.image }}"
        filename_prefix: "flowx_sd3"
        output_dir: "~/flowx-output"
