Name: video-v2v-animatediff
Description: >-
  视频到视频（整段重采样）：源视频 → Motion 组合（SD1.x + 运动模块 → AnimateDiff 管道）
  → video-v2v 整段 v2v 重采样（时间一致性优于逐帧，闪烁少）→ 保存 mp4。
  ⚠️ 需要管道支持 v2v（AnimateDiffVideoToVideoPipeline）：算子先查 __call__ 签名，
  不支持会明确报错、不会退化成文生视频。
Param:
  service_url: "http://192.168.5.60:8100"              # Studio 宿主机/公网可达（local 节点 + 画布侧读取）
  service_url_internal: "http://172.17.0.1:8100"       # docker 节点容器内网地址
  service_token: "30e494999da13134808ee280aea6dffd"   # 服务端 INFERENCE_TOKEN（已启用鉴权；换部署改这里）
  source_video: "~/flowx-input/uploads/dance.mp4"       # 源视频（FlowX 本机路径）
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> LoadVideo
    Ensure --> MotionLoad
    MotionLoad --> V2V
    LoadVideo --> V2V
    V2V --> SaveVideo
    SaveVideo --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.1.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  LoadVideo:
    name: 加载源视频
    config:
      nodeRef: load-video@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        video_path: "{{ Param.source_video }}"
        max_frames: 16         # AnimateDiff 运动模块按 16 帧窗口；长片分段或多批
        fps: 8
        width: 512
        height: 512
  MotionLoad:
    name: Motion组合
    config:
      nodeRef: motion-loader@1.3.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "v1-5-pruned-emaonly"
        motion_name: "mm_sd_v15_v2.ckpt"
  V2V:
    name: 整段v2v重采样
    config:
      nodeRef: video-v2v@1.0.0
      params:
        service_url: "{{ Param.service_url_internal }}"
        service_url_host: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        model: "{{ MotionLoad.model_ref }}"
        video: "{{ LoadVideo.video }}"
        prompt: "a woman dancing, cinematic lighting, detailed face, best quality"
        neg_prompt: "lowres, blurry, worst quality, watermark, text"
        strength: 0.7          # 截断比例：有效去噪步数 = int(steps×strength) = 17
        steps: 25              # 名义步数；配比 <12 基本看不到重绘（算子日志会报有效步数）
        cfg: 7.5
        enforce_inference_steps: false   # true = ComfyUI 语义（steps 即实际步数）
        seed: -1
        decode_chunk_size: 8    # fp32 VAE 整块解码易 OOM（exec 309 教训）
        preview_every: 5
        job_timeout: 7200
  SaveVideo:
    name: 保存视频
    config:
      nodeRef: save-video@1.2.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        video: "{{ V2V.video }}"
        filename_prefix: "flowx_v2v_animatediff"
        output_dir: "~/flowx-output"
