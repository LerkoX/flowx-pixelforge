Name: sd-video-t2v-animatediff
Description: 文生视频（AnimateDiff）：健康检查 → Motion 组合（SD1.x 底模 + 运动模块 → AnimateDiffPipeline）→ 视频生成（异步任务，画布进度卡片）→ 保存视频 mp4。文本驱动，无需首帧图
Param:
  service_url: "https://calculated-nascar-publications-sorry.trycloudflare.com"  # 推理服务地址（cloudflared 临时隧道 → 211:8100；隧道重建后需更新）
  service_token: ""                       # 服务端 INFERENCE_TOKEN，未启用鉴权留空
  ckpt_name: "v1-5-pruned-emaonly"        # SD1.x 底模（AnimateDiff v1.5 运动模块只兼容 SD1.x）
  motion_name: "animatediff-motion-adapter-v1-5-2"  # MODELS_DIR/motion/ 下的运动模块
  prompt: "a cat walking through a sunlit garden, gentle breeze, cinematic"
  negative: "blur, distortion, low quality, watermark"
  width: 512
  height: 512
  num_frames: 16                          # AnimateDiff 甜点 16 帧 @8fps ≈ 2 秒
  fps: 8
  steps: 20
  cfg: 7.5
  seed: -1
Graph: |
  stateDiagram-v2
    [*] --> Ensure
    Ensure --> MotionLoad
    MotionLoad --> VideoGen
    VideoGen --> SaveVideo
    SaveVideo --> [*]
Nodes:
  Ensure:
    name: 服务健康检查
    config:
      nodeRef: inference-ensure@1.0.0
      executor: local
      params:
        service_url: "{{ Param.service_url }}"
        service_token: "{{ Param.service_token }}"
        wait_seconds: 60
  MotionLoad:
    name: Motion组合
    config:
      nodeRef: motion-loader@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        ckpt_name: "{{ Param.ckpt_name }}"
        motion_name: "{{ Param.motion_name }}"
  VideoGen:
    name: 视频生成
    config:
      nodeRef: video-gen@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        model_ref: "{{ MotionLoad.model_ref }}"
        prompt: "{{ Param.prompt }}"
        negative_prompt: "{{ Param.negative }}"
        width: "{{ Param.width }}"
        height: "{{ Param.height }}"
        num_frames: "{{ Param.num_frames }}"
        fps: "{{ Param.fps }}"
        steps: "{{ Param.steps }}"
        cfg: "{{ Param.cfg }}"
        seed: "{{ Param.seed }}"
  SaveVideo:
    name: 保存视频
    config:
      nodeRef: save-video@1.0.0
      executor: local
      params:
        service_url: "{{ Ensure.service_url }}"
        service_token: "{{ Param.service_token }}"
        video: "{{ VideoGen.video }}"
        filename_prefix: "flowx_t2v"
        output_dir: "~/flowx-output"
